<VirtualHost *:80>
    ServerName mylaravel.local

    DocumentRoot /var/www/html/mylaravel/public

    # Serve Laravel stautoparts app at /stautoparts
    Alias /stautoparts /var/www/html/stautoparts/public

    <Directory /var/www/html/mylaravel/public>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/stautoparts/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mylaravel_error.log
    CustomLog ${APACHE_LOG_DIR}/mylaravel_access.log combined
</VirtualHost>
